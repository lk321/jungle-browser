pre-commit:
  commands:
    whitespace:
      run: git diff-index --check --cached HEAD --
    workflows:
      run: ./scripts/validate-workflow-yaml.sh

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/validate-conventional-commit.sh {1}

pre-push:
  commands:
    tests:
      run: ./scripts/run-tests.sh
